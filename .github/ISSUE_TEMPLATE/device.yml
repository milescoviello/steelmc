name: Device report
description: How steelmc did with your SteelSeries device, or ask for one to be supported
labels: ["device"]
body:
  - type: markdown
    attributes:
      value: |
        `steelmc-devices report` fills this in for you, and so does **Report how it went** on the app's Other devices tab. Most devices here have never been tried on a real one, so every report helps, even "it all worked".
  - type: input
    id: device
    attributes:
      label: Device
      description: Its name and ID, like Rival 3 (1038:1824)
    validations:
      required: true
  - type: dropdown
    id: result
    attributes:
      label: How did it go?
      options:
        - Everything I tried worked
        - Some of it worked
        - Nothing worked
        - It isn't supported yet, and I'd like it to be
    validations:
      required: true
  - type: textarea
    id: tried
    attributes:
      label: What you tried
      description: Which settings did what they say, which didn't, and what happened instead.
  - type: textarea
    id: report
    attributes:
      label: Report
      description: What `steelmc-devices report` prints. It holds the device's IDs, firmware and HID layout, your distro and kernel, and nothing else.
      render: text
    validations:
      required: true
